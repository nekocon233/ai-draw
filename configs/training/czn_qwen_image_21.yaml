# 卡厄思梦境小人 (Chaos Zero Nightmare SD figures) style LoRA; recipe and first five preview prompts as DaikeiQwen21.
# Dataset: Spine skeletons unpacked with /opt/tools/czn (user has the rights holder's permission), rendered with spine-ts 3.8,
# WD v3 tags (chibi tags removed), split by scripts/prepare_qwen_image_21_training.py, Chinese by
# prepare_qwen_image_21_bilingual.py --forbid (no chibi/style words, so the proportions belong to the LoRA).
# 484 frames of 107 battle models (4/5-digit IDs plus 8 costume variants), up to 6 diverse poses each, rendered at
# 1:1 texel density, Real-CUGAN 4x, ~75% white / ~25% light flat grounds; 479 train / 5 validation.
job: extension
config:
  name: CznQwen21
  process:
    - type: diffusion_trainer
      training_folder: /app/ai-toolkit/output
      sqlite_db_path: /app/ai-toolkit/aitk_db.db
      device: cuda:0
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 200
        max_step_saves_to_keep: 20
      datasets:
        - folder_path: /app/ai-toolkit/datasets/czn_qwen21/train
          caption_ext: txt
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        gradient_accumulation: 1
        # First run ended at 4000 (backup: /opt/ai-toolkit/backups/CznQwen21-step4000-20260928); continued to 8000 on request.
        steps: 8000
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        unload_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        timestep_type: shift
        optimizer: prodigyopt
        lr: 1.0
        lr_scheduler: constant
        optimizer_params:
          d_coef: 1.0
          weight_decay: 0.01
          use_bias_correction: true
          safeguard_warmup: true
        dtype: bf16
        skip_first_sample: false
        disable_sampling: false
      model:
        name_or_path: Comfy-Org/Qwen-Image-2.1
        arch: qwen_image_2
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: convrot8
        low_vram: true
        layer_offloading: true
        layer_offloading_transformer_percent: 0.5
        layer_offloading_text_encoder_percent: 1.0
      sample:
        sampler: flowmatch
        sample_every: 400
        width: 1024
        height: 1024
        # The AI Toolkit web UI reads `samples`; a legacy `prompts` list crashes its Samples tab.
        samples:
          - prompt: 一个女孩
          - prompt: 一个二次元女孩
          - prompt: 1girl, solo, black_hair, twintails, school_uniform, white_background
          - prompt: 一个穿黄色雨衣的女孩，站在公交站旁，手持一把蓝色雨伞。
          - prompt: A girl wearing a blue jacket, holding a red cup, simple white background.
          # Content-only checks: the LoRA alone should give the SD proportions and style.
          - prompt: 一个银色短发的少年，穿黑色长外套，右手握着长剑，站在白色背景前。
          - prompt: 一个戴眼镜的女孩坐在咖啡馆的窗边看书。
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 1
        network_multiplier: 0.8
        sample_steps: 40
      logging:
        log_every: 1
        use_ui_logger: true
        use_wandb: false
meta:
  name: "[name]"
  version: "2.0"
  base_model: Qwen/Qwen-Image-2.1
  caption_format: wd_v3_tags_then_chinese_paragraph
