# AI Toolkit 0.13.18 / 31ddc70. Use the ComfyUI models directory through MODELS_PATH.
job: extension
config:
  name: AmeniwaQwen21
  process:
    - type: sd_trainer
      training_folder: output
      device: cuda:0
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 200
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: /app/ai-toolkit/datasets/ameniwa_qwen21/train
          caption_ext: txt
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 4000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 0.00005
        skip_first_sample: true
        disable_sampling: true
        dtype: bf16
      model:
        name_or_path: Comfy-Org/Qwen-Image-2.1
        arch: qwen_image_2
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: convrot8
        low_vram: true
        layer_offloading: true
        layer_offloading_transformer_percent: 0.5
        layer_offloading_text_encoder_percent: 1.0
      sample:
        sampler: flowmatch
        sample_every: 200
        width: 768
        height: 768
        prompts:
          - A girl wearing a blue jacket, holding a red cup, simple white background.
          - A girl with black hair sitting near a window, smiling, clean illustration.
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 1
        sample_steps: 40
meta:
  name: "[name]"
  version: "1.0"
  base_model: Qwen/Qwen-Image-2.1
